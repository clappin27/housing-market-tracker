# Checks Zillow Research for new data every day, commits any changes to the repo,
# and republishes the website on GitHub Pages. When a new month of data arrives, it
# also posts that month's market alerts as an issue in this repo, which GitHub
# sends to you as a notification (turn off with "notify": false in config.json).
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Run it by hand any time from the Actions tab -> "Update data and publish site" -> Run workflow.

name: Update data and publish site

on:
  schedule:
    - cron: "17 15 * * *" # daily at 15:17 UTC; Zillow usually publishes mid-month
  workflow_dispatch:
    inputs:
      send_alerts:
        description: "Also post this month's market alerts as an issue now"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write # commit refreshed data
  pages: write # publish the site
  id-token: write # required by deploy-pages

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update-data:
    # Pushes you make yourself skip straight to publishing.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit refreshed data
      issues: write # post monthly market alerts
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Download latest data and photos
        id: update
        run: python3 scripts/update_data.py --alerts-markdown "$RUNNER_TEMP/alerts.md"

      - name: Commit changes
        id: commit
        run: |
          git add -A site/data
          if git diff --cached --quiet; then
            echo "Nothing new from Zillow today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update housing data ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Post market alerts as an issue
        if: >-
          ${{ steps.update.outputs.notify == 'true' &&
          ((steps.update.outputs.new_month == 'true' && steps.commit.outputs.changed == 'true') ||
          inputs.send_alerts == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.update.outputs.alerts_title }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/alerts.md"

  publish-site:
    needs: update-data
    # Publish after your own pushes, manual runs, and scheduled runs that found new data.
    if: >-
      ${{ !cancelled() && needs.update-data.result != 'failure' &&
      (github.event_name != 'schedule' || needs.update-data.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }} # include the data commit made above

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
